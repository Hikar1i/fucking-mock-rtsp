[project]
name = "local-mock-rtsp"
version = "0.1.0"
description = "Local RTSP stream simulator for camera anomaly detection development"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "opencv-python>=4.9.0",
    "pyyaml>=6.0.1",
    "requests>=2.31.0",
    "numpy>=1.26.0",
    "aiofiles>=23.2.1",
    "jinja2>=3.1.4",
]

[project.scripts]
mock-rtsp = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = []
