server:
  rtsp_port: 8554
  web_port: 8080
  host: "0.0.0.0"
  # IP whitelist for web UI and RTSP: empty = allow all; add IPs to restrict.
  # 127.0.0.1 and ::1 are always allowed regardless of this list.
  # Example: ["192.168.1.100", "10.0.0.5"]
  allowed_ips: ["192.168.3.168", "192.168.3.205"]

webcam:
  enabled: true
  device_id: 0
  # Requested resolution; webcam will use nearest supported mode.
  width: 1024
  height: 576
  fps: 25
  rtsp_path: "/webcam"

video:
  enabled: true
  default_file: ""
  videos_dir: "videos"
  loop: true
  width: 1024
  height: 576
  fps: 25
  rtsp_path: "/video"

mediamtx:
  bin_dir: "bin"
  version: "v1.9.1"
  download_timeout: 60

encoding:
  encoder: "auto"
  bitrate: "1M"
  preset: "ultrafast"
